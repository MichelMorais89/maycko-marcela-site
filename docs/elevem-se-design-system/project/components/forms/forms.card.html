<!-- @dsCard group="Components" viewport="700x500" name="Forms — Input, Field" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-page); padding: 32px; font-family: var(--font-sans); }
  .wrap { max-width: 636px; margin: 0 auto; }

  /* group headers */
  .heads { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; margin-bottom: 20px; }
  .heads .h { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-muted); padding-bottom: 12px; border-bottom: 1px solid var(--border-hairline); }

  /* baseline grid: fixed row heights keep both columns aligned
     regardless of hint/error text */
  .fields { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; row-gap: 26px; grid-auto-rows: 80px; }
  .cell { min-width: 0; }
  /* button sits on the input line, not the label line */
  .cell.btn { display: flex; align-items: flex-start; padding-top: 26px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Field, Button } = window.ElevemSeDesignSystem_00d476;
  function Demo() {
    return (
      <div className="wrap">
        <div className="heads">
          <div className="h">Formulário de aplicação</div>
          <div className="h">Variantes &amp; estados</div>
        </div>
        <div className="fields">
          {/* row 1 */}
          <div className="cell"><Field label="Seu nome" htmlFor="n"><Input id="n" defaultValue="Marcela Zanardo" /></Field></div>
          <div className="cell"><Field label="Caixa (padrão)" htmlFor="b"><Input id="b" placeholder="Texto do campo" /></Field></div>
          {/* row 2 */}
          <div className="cell"><Field label="Melhor e-mail" hint="Você recebe o convite por aqui." required htmlFor="e"><Input id="e" type="email" placeholder="nome@empresa.com" /></Field></div>
          <div className="cell"><Field label="Linha (minimal)" htmlFor="l"><Input id="l" variant="line" placeholder="Texto do campo" /></Field></div>
          {/* row 3 */}
          <div className="cell"><Field label="Telefone" htmlFor="p"><Input id="p" placeholder="(00) 00000-0000" /></Field></div>
          <div className="cell"><Field label="Desabilitado" htmlFor="d"><Input id="d" disabled defaultValue="Indisponível" /></Field></div>
          {/* row 4 */}
          <div className="cell btn"><Button variant="primary" fullWidth>Quero participar</Button></div>
          <div className="cell"><Field label="Com erro" error="Informe um e-mail válido." htmlFor="x"><Input id="x" invalid defaultValue="errado@" /></Field></div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
