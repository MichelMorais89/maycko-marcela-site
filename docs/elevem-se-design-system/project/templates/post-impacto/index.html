<!-- @template name="Post de impacto (Instagram)" description="Feed 4:5 'que grita' — foto em duotone navy + headline em CAIXA-ALTA, dourado e serifada. Troque foto, kicker e título." -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevem-se — Post de impacto</title>
<script src="./ds-base.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #15110F; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: var(--font-sans); padding: 24px; }
  .stage { position: relative; }

  /* 4:5 feed post @ 1080x1350, scaled to fit */
  .post { width: 1080px; height: 1350px; position: absolute; top: 0; left: 0; overflow: hidden;
          background: var(--ink-950); transform-origin: top left; }

  /* === troque a imagem aqui === */
  .ph { position: absolute; inset: 0; }
  .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; display: block; }

  /* navy duotone + cinematic protection gradient (mantém o drama, texto legível) */
  .tone { position: absolute; inset: 0; background: var(--ink-800); mix-blend-mode: color; opacity: 0.46; }
  .deepen { position: absolute; inset: 0; background: var(--ink-950); mix-blend-mode: multiply; opacity: 0.20; }
  .grad { position: absolute; inset: 0; background:
      linear-gradient(180deg, rgba(13,20,34,0.55) 0%, rgba(13,20,34,0.10) 24%, rgba(13,20,34,0.15) 50%, rgba(13,20,34,0.72) 78%, rgba(13,20,34,0.97) 100%); }

  .content { position: absolute; inset: 0; padding: 76px 74px 84px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { display: block; width: 58px; height: 58px; }
  .brand b { font-family: var(--font-display); font-weight: 500; font-size: 40px; color: var(--ivory); letter-spacing: .04em; }

  .bottom { margin-top: auto; }
  /* KICKER — caixa-alta, tracking largo */
  .kicker { font-family: var(--font-sans); font-size: 21px; letter-spacing: .34em; text-transform: uppercase; color: var(--gold-300); font-weight: 600; }
  /* HEADLINE DE IMPACTO — CAIXA-ALTA, grande, serifada (a regra: "grita") */
  .head { font-family: var(--font-display); font-weight: 600; font-size: 104px; line-height: 1.0;
          color: var(--white-warm); margin: 26px 0 0; text-transform: uppercase; letter-spacing: .015em;
          text-wrap: balance; text-shadow: 0 2px 40px rgba(13,20,34,0.7); }
  .head em { font-style: italic; color: var(--gold-300); }
  .rule { width: 84px; height: 2px; background: var(--gold-400); margin: 40px 0 0; }
  .sub { font-family: var(--font-display); font-weight: 500; font-size: 34px; line-height: 1.3; color: var(--ink-100); margin: 32px 0 0; max-width: 26ch; }

  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 50px; }
  .handle { font-family: var(--font-sans); font-size: 22px; letter-spacing: .12em; color: var(--ivory); opacity: .85; }
  .tagpill { font-family: var(--font-sans); font-size: 17px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-200); border: 1px solid rgba(214,182,115,0.5); border-radius: 999px; padding: 12px 24px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="post" id="post">
      <div class="ph"><img src="../../assets/photos/casal-bw-web.jpg" alt="Maycko e Marcela"></div>
      <div class="tone"></div>
      <div class="deepen"></div>
      <div class="grad"></div>
      <div class="content">
        <div class="brand">
          <img src="../../assets/elevemse-monogram-light.svg" alt="">
          <b>Elevem-se</b>
        </div>
        <div class="bottom">
          <div class="kicker">O método · 12 meses</div>
          <h1 class="head">Não é sorte. É <em>método.</em></h1>
          <div class="rule"></div>
          <p class="sub">Casamento não se sustenta na sorte — se sustenta com estrutura, força e estratégia.</p>
          <div class="foot">
            <span class="handle">@elevem.se</span>
            <span class="tagpill">Mentoria para casais</span>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
  function fit() {
    const post = document.getElementById('post');
    const s = Math.min((window.innerWidth - 48) / 1080, (window.innerHeight - 48) / 1350, 1);
    post.style.transform = 'scale(' + s + ')';
    const st = document.querySelector('.stage');
    st.style.height = (1350 * s) + 'px'; st.style.width = (1080 * s) + 'px';
  }
  addEventListener('resize', fit); addEventListener('load', fit); fit();
</script>
</body>
</html>
