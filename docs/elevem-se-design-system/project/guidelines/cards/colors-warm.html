<!-- @dsCard group="Colors" viewport="700x168" name="Calor / Clay" subtitle="Acento quente (Amante/Explorador) — intimidade · nunca rosa/magenta · a confirmar" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; height: 96px; border-radius: var(--radius-md); box-shadow: var(--ring-hairline); display: flex; flex-direction: column; justify-content: flex-end; padding: 9px 11px; }
  .sw b { font-weight: 500; font-size: 11px; }
  .sw span { font-size: 9.5px; opacity: .85; font-variant-numeric: tabular-nums; }
  .dk { color: #fff; } .lt { color: var(--wine-900); }
  .cap { margin-top: 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-warm); display: flex; align-items: center; gap: 10px; }
  .cap::before { content:""; width: 26px; height: 1px; background: var(--warm-300); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw dk" style="background:var(--warm-600)"><b>600</b><span>#9E5E45 · texto</span></div>
    <div class="sw dk" style="background:var(--warm-500)"><b>500</b><span>#B47254 · acento</span></div>
    <div class="sw lt" style="background:var(--warm-300)"><b>300</b><span>#D8A98E · linha</span></div>
    <div class="sw lt" style="background:var(--warm-100)"><b>100</b><span>#F1DECE · wash</span></div>
  </div>
  <div class="cap">Calor de vela — uso discreto, ponte entre vinho e dourado</div>
</body>
</html>
