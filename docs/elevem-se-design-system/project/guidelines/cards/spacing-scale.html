<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 24px 28px; font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .box { background: var(--wine-600); border-radius: var(--radius-xs); }
  .item b { font-size: 10px; color: var(--graphite-900); font-weight: 500; }
  .item span { font-size: 9px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="width:4px;height:4px"></div><b>1</b><span>4</span></div>
    <div class="item"><div class="box" style="width:8px;height:8px"></div><b>2</b><span>8</span></div>
    <div class="item"><div class="box" style="width:12px;height:12px"></div><b>3</b><span>12</span></div>
    <div class="item"><div class="box" style="width:16px;height:16px"></div><b>4</b><span>16</span></div>
    <div class="item"><div class="box" style="width:24px;height:24px"></div><b>5</b><span>24</span></div>
    <div class="item"><div class="box" style="width:32px;height:32px"></div><b>6</b><span>32</span></div>
    <div class="item"><div class="box" style="width:40px;height:40px"></div><b>7</b><span>40</span></div>
    <div class="item"><div class="box" style="width:48px;height:48px"></div><b>8</b><span>48</span></div>
    <div class="item"><div class="box" style="width:64px;height:64px"></div><b>9</b><span>64</span></div>
  </div>
</body>
</html>
