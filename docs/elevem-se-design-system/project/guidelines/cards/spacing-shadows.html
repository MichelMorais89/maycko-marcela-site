<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 26px 28px; font-family: var(--font-sans); }
  .row { display: flex; gap: 26px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 11px; }
  .box { width: 96px; height: 64px; background: var(--white-warm); border-radius: var(--radius-md); }
  .item b { font-size: 10.5px; color: var(--graphite-900); font-weight: 500; }
  .rulewrap { margin-left: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .rule { width: 120px; height: 1px; background: var(--rule-gold); }
  .rulewrap span { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-gold); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><b>xs</b></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><b>sm</b></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><b>md</b></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><b>lg</b></div>
    <div class="rulewrap"><div class="rule"></div><span>gold rule</span></div>
  </div>
</body>
</html>
