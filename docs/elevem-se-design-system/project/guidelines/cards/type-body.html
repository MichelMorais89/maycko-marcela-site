<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 24px 28px; font-family: var(--font-sans); }
  p { color: var(--graphite-700); font-size: 15px; line-height: 1.7; max-width: 56ch; font-weight: 400; margin: 0 0 16px; }
  .tagline { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--text-gold); font-weight: 500; }
  .weights { display: flex; gap: 22px; margin-top: 14px; }
  .weights span { font-size: 17px; color: var(--graphite-900); }
  .weights small { display: block; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
</style>
</head>
<body>
  <p>Relacionamentos não terminam da noite para o dia, mas por pequenos desgastes diários que se acumulam ao longo do tempo. A Elevem-se reconstrói os pilares da vida a dois — com firmeza e carinho.</p>
  <div class="tagline">Mentoria para casais</div>
  <div class="weights">
    <div><span style="font-weight:300">Aa</span><small>Light 300</small></div>
    <div><span style="font-weight:400">Aa</span><small>Regular 400</small></div>
    <div><span style="font-weight:500">Aa</span><small>Medium 500</small></div>
    <div><span style="font-weight:600">Aa</span><small>Semibold 600</small></div>
  </div>
</body>
</html>
