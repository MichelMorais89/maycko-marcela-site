<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevem-se — Post de impacto (modo claro)</title>
<link rel="stylesheet" href="styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #E5DCCB; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: var(--font-sans); padding: 24px; }
  .stage { position: relative; }

  /* 4:5 feed post @ 1080x1350, scaled to fit */
  .post {
    width: 1080px; height: 1350px;
    position: absolute; top: 0; left: 0;
    overflow: hidden;
    background: var(--ivory);
    transform-origin: top left;
    padding: 76px 74px 84px;
    display: flex; flex-direction: column;
  }

  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { display: block; width: 56px; height: 56px; }
  .brand b { font-family: var(--font-display); font-weight: 500; font-size: 40px; color: var(--wine-700); letter-spacing: .04em; }

  .frame { margin: 54px 0 0; border-radius: 6px; overflow: hidden; height: 560px; position: relative;
           box-shadow: inset 0 0 0 1.5px var(--gold-500); flex: none; }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; filter: grayscale(1) contrast(1.03); display: block; }
  .frame .inset { position: absolute; inset: 18px; border: 1px solid rgba(198,164,77,0.55); border-radius: 3px; pointer-events: none; }

  .bottom { margin-top: auto; padding-top: 48px; }
  .eye { font-family: var(--font-sans); font-size: 21px; letter-spacing: .34em; text-transform: uppercase; color: var(--text-gold); font-weight: 600; }
  .head { font-family: var(--font-display); font-weight: 600; font-size: 62px; line-height: 1.06; color: var(--wine-700); margin: 26px 0 0; text-transform: uppercase; letter-spacing: .015em; text-wrap: balance; }
  .head em { font-style: italic; color: var(--wine-600); background: linear-gradient(to bottom, transparent 64%, var(--highlight-warm) 64%); padding: 0 .05em; }
  .rule { width: 84px; height: 2px; background: var(--gold-500); margin: 34px 0 0; }

  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 44px; }
  .handle { font-family: var(--font-sans); font-size: 22px; letter-spacing: .12em; color: var(--graphite-700); }
  .tagpill { font-family: var(--font-sans); font-size: 17px; letter-spacing: .22em; text-transform: uppercase; color: var(--wine-700); border: 1px solid var(--gold-500); border-radius: 999px; padding: 12px 24px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="post" id="post">
      <div class="brand">
        <img src="assets/elevemse-monogram.svg" alt="">
        <b>Elevem-se</b>
      </div>
      <div class="frame">
        <img src="assets/photos/casal-01-web.jpg" alt="Maycko e Marcela">
        <span class="inset"></span>
      </div>
      <div class="bottom">
        <div class="eye">Mentoria para casais</div>
        <h1 class="head">Vocês construíram tudo juntos. Agora construam <em>o que mais importa.</em></h1>
        <div class="rule"></div>
        <div class="foot">
          <span class="handle">@elevem.se</span>
          <span class="tagpill">Processo por aplicação</span>
        </div>
      </div>
    </div>
  </div>

<script>
  function fit() {
    const post = document.getElementById('post');
    const margin = 48;
    const s = Math.min((window.innerWidth - margin) / 1080, (window.innerHeight - margin) / 1350, 1);
    post.style.transform = 'scale(' + s + ')';
    const stage = document.querySelector('.stage');
    stage.style.height = (1350 * s) + 'px';
    stage.style.width = (1080 * s) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  fit();
</script>
</body>
</html>
