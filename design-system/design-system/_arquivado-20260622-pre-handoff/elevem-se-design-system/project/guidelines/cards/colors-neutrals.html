<!-- @dsCard group="Colors" viewport="700x180" name="Neutros claros" subtitle="Marfim, creme, areia, nude — leveza e respiro" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--white-warm); font-family: var(--font-sans); padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; height: 104px; border-radius: var(--radius-md); box-shadow: var(--ring-hairline); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 11px; color: var(--graphite-700); }
  .sw b { font-weight: 500; font-size: 12px; letter-spacing: .04em; color: var(--graphite-900); }
  .sw span { font-size: 10px; opacity: .8; font-variant-numeric: tabular-nums; }
  .sw small { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-gold); margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ivory)"><small>marfim</small><b>--ivory</b><span>#F4EEE2 · page</span></div>
    <div class="sw" style="background:var(--cream)"><small>creme</small><b>--cream</b><span>#EBE1CE · sunken</span></div>
    <div class="sw" style="background:var(--sand)"><small>areia</small><b>--sand</b><span>#D9C4A3 · fill</span></div>
    <div class="sw" style="background:var(--nude)"><small>nude</small><b>--nude</b><span>#C9B492 · border</span></div>
  </div>
</body>
</html>
