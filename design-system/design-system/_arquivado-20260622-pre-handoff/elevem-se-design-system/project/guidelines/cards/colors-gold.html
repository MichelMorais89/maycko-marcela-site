<!-- @dsCard group="Colors" viewport="700x168" name="Dourado / Gold" subtitle="Accent — prosperidade, sofisticação · never small text" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px 24px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; }
  .sw b { font-weight: 500; font-size: 11px; letter-spacing: .04em; }
  .sw span { font-size: 9.5px; opacity: .85; font-variant-numeric: tabular-nums; }
  .lt { color: var(--wine-900); }
  .dk { color: var(--gold-50); }
  .cap { margin-top: 12px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-gold); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw dk" style="background:var(--gold-800)"><b>800</b><span>#735422</span></div>
    <div class="sw dk" style="background:var(--gold-700)"><b>700</b><span>#946F26</span></div>
    <div class="sw dk" style="background:var(--gold-600)"><b>600</b><span>#AC8838</span></div>
    <div class="sw lt" style="background:var(--gold-500)"><b>500</b><span>#C2A14D</span></div>
    <div class="sw lt" style="background:var(--gold-400)"><b>400</b><span>#D2B673</span></div>
    <div class="sw lt" style="background:var(--gold-300)"><b>300</b><span>#E0CB99</span></div>
    <div class="sw lt" style="background:var(--gold-200)"><b>200</b><span>#EDDFBE</span></div>
    <div class="sw lt" style="background:var(--gold-100)"><b>100</b><span>#F6EFD8</span></div>
    <div class="sw lt" style="background:var(--gold-50)"><b>50</b><span>#FBF7EB</span></div>
  </div>
  <div class="cap">500 = rules &amp; accents · 700 = gold text on light · decorative, not for body copy</div>
</body>
</html>
