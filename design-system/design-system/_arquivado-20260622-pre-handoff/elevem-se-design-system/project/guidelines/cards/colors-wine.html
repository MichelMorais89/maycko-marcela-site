<!-- @dsCard group="Colors" viewport="700x168" name="Vinho / Bordô" subtitle="Primary brand — romance, paixão, profundidade" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px 24px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; }
  .sw b { font-weight: 500; font-size: 11px; letter-spacing: .04em; }
  .sw span { font-size: 9.5px; opacity: .8; font-variant-numeric: tabular-nums; }
  .lt { color: var(--wine-900); }
  .dk { color: var(--gold-100); }
  .cap { margin-top: 12px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-gold); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw dk" style="background:var(--wine-950)"><b>950</b><span>#2A0E16</span></div>
    <div class="sw dk" style="background:var(--wine-900)"><b>900</b><span>#3A1420</span></div>
    <div class="sw dk" style="background:var(--wine-800)"><b>800</b><span>#4A1B29</span></div>
    <div class="sw dk" style="background:var(--wine-700)"><b>700</b><span>#5C2230</span></div>
    <div class="sw dk" style="background:var(--wine-600)"><b>600</b><span>#6E2A36</span></div>
    <div class="sw dk" style="background:var(--wine-500)"><b>500</b><span>#874050</span></div>
    <div class="sw lt" style="background:var(--wine-300)"><b>300</b><span>#C8939B</span></div>
    <div class="sw lt" style="background:var(--wine-100)"><b>100</b><span>#F3E2E0</span></div>
    <div class="sw lt" style="background:var(--wine-50)"><b>50</b><span>#FAF2F0</span></div>
  </div>
  <div class="cap">600 = vinho da marca (botões, painéis) · 700 = texto/hover · tints p/ fills</div>
</body>
</html>
