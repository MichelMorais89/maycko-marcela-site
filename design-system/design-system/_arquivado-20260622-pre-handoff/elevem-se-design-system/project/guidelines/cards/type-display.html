<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); padding: 24px 28px; }
  .eye { font-family: var(--font-sans); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--text-gold); }
  .d1 { font-family: var(--font-display); font-weight: 500; font-size: 64px; line-height: 1.02; color: var(--wine-700); letter-spacing: -.01em; margin: 6px 0 2px; }
  .d2 { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 30px; color: var(--graphite-900); line-height: 1.1; }
  .meta { font-family: var(--font-sans); font-size: 11px; color: var(--text-muted); margin-top: 14px; letter-spacing: .03em; }
</style>
</head>
<body>
  <div class="eye">Aa — 400 · 500 · 600 · 700 · italic</div>
  <div class="d1">Elevem-se juntos</div>
  <div class="d2">um relacionamento forte, consciente e próspero</div>
  <div class="meta">Spectral · serifada editorial · use em títulos e citações · acentos discretos em PT-BR</div>
</body>
</html>
