<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px 24px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 9px; }
  .sw b { font-weight: 500; font-size: 11px; letter-spacing: .04em; }
  .sw span { font-size: 9.5px; opacity: .85; font-variant-numeric: tabular-nums; }
  .dk { color: var(--ink-100); } .lt { color: var(--ink-900); }
  .cap { margin-top: 12px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-anchor); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw dk" style="background:var(--ink-950)"><b>950</b><span>#0D1422</span></div>
    <div class="sw dk" style="background:var(--ink-900)"><b>900</b><span>#16233A</span></div>
    <div class="sw dk" style="background:var(--ink-800)"><b>800</b><span>#21314F</span></div>
    <div class="sw dk" style="background:var(--ink-700)"><b>700</b><span>#2C3F61</span></div>
    <div class="sw dk" style="background:var(--ink-600)"><b>600</b><span>#3B4F74</span></div>
    <div class="sw dk" style="background:var(--ink-400)"><b>400</b><span>#7487A0</span></div>
    <div class="sw lt" style="background:var(--ink-200)"><b>200</b><span>#CCD4DF</span></div>
    <div class="sw lt" style="background:var(--ink-100)"><b>100</b><span>#E5EAF0</span></div>
  </div>
  <div class="cap">800 = navy da marca · âncora ao lado do vinho · base do modo escuro</div>
</body>
</html>
